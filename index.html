<!DOCTYPE html>
<html>
<head>
    <title>Word Fish</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #DDF8FF 0%, #9BE7FF 45%, #EFFFFA 100%);
            color: #073B4C;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        h1 { font-size: 44px; margin: 8px 0; }
        h2 { color: #0B6E8A; }
        p { font-size: 18px; }

        .screen {
            max-width: 1050px;
            margin: 0 auto;
            background: rgba(255,255,255,0.88);
            border-radius: 36px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(7,59,76,0.18);
        }

        .sea-header {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #0B6E8A;
            font-weight: bold;
        }

        input, textarea {
            width: 90%;
            max-width: 460px;
            font-size: 18px;
            padding: 14px;
            margin: 8px;
            border-radius: 18px;
            border: 2px solid #8EDCE6;
            outline: none;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            font-size: 18px;
            font-weight: bold;
            padding: 13px 24px;
            border: none;
            border-radius: 999px;
            background: #00A6C8;
            color: white;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 5px 0 #007D96;
        }

        button:hover {
            transform: translateY(-2px);
            background: #0091B0;
        }

        .green-button {
            background: #06D6A0;
            box-shadow: 0 5px 0 #05A87D;
        }

        .yellow-button {
            background: #FFB703;
            box-shadow: 0 5px 0 #D99500;
        }

        .red-button {
            background: #EF476F;
            box-shadow: 0 5px 0 #C92F55;
        }

        .soft-button {
            background: #E0F7FA;
            color: #073B4C;
            box-shadow: 0 5px 0 #9BD9E2;
        }

        .disabled-button {
            background: #D9EEF2;
            color: #5D7F88;
            box-shadow: 0 5px 0 #B8D5DB;
            cursor: not-allowed;
        }

        .card {
            background: white;
            padding: 22px;
            margin: 16px auto;
            border-radius: 28px;
            width: 90%;
            max-width: 820px;
            box-shadow: 0 10px 22px rgba(7,59,76,0.13);
            border: 2px solid rgba(142,220,230,0.75);
        }

        .set-card {
            text-align: left;
        }

        .set-actions {
            text-align: center;
        }

        .small-label {
            color: #0B6E8A;
            font-weight: bold;
        }

        .editor-toolbar {
            background: #E0F7FA;
            border-radius: 28px;
            padding: 18px;
            margin: 20px auto;
            max-width: 900px;
        }

        .word-card {
            text-align: left;
        }

        .word-card.drag-over {
            border-color: #FFB703;
            background: #FFF9E8;
        }

        .word-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card-number {
            background: #E0F7FA;
            color: #0B6E8A;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: bold;
        }

        .drag-handle {
            cursor: grab;
            user-select: none;
            font-weight: bold;
            color: #0B6E8A;
            background: #EFFFFA;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .word-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            color: #0B6E8A;
            font-weight: bold;
            margin-left: 12px;
            margin-bottom: 4px;
        }

        .field-group input {
            width: 100%;
            max-width: none;
            margin: 0;
        }

        .image-preview {
            margin-top: 16px;
            padding: 14px;
            background: #F0FCFF;
            border: 2px dashed #8EDCE6;
            border-radius: 22px;
            text-align: center;
        }

        .image-preview img {
            max-width: 240px;
            max-height: 170px;
            border-radius: 18px;
            display: block;
            margin: 10px auto;
            border: 4px solid white;
        }

        #gameScreen {
            max-width: 1000px;
            margin: 0 auto;
            min-height: 620px;
            background: linear-gradient(180deg, #7FE7FF 0%, #1CA7C9 52%, #087EA0 100%);
            border-radius: 38px;
            padding: 36px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        #currentPrompt {
            font-size: 52px;
            background: #FFD166;
            color: #073B4C;
            padding: 30px 60px;
            border-radius: 70px;
            display: inline-block;
            margin: 30px;
            animation: swim 0.9s ease;
            box-shadow: 0 9px 0 #E9A92B;
            max-width: 90%;
            word-break: break-word;
        }

        @keyframes swim {
            from { transform: translateX(-230px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        #gameImage {
            max-width: 320px;
            max-height: 240px;
            border-radius: 28px;
            margin: 22px auto;
            display: none;
            border: 8px solid white;
            box-shadow: 0 10px 22px rgba(7,59,76,0.25);
        }

        #answerInput {
            background: white;
            text-align: center;
            font-size: 24px;
        }

        #feedback {
            font-size: 30px;
            font-weight: bold;
            min-height: 45px;
        }

        #pearlBar {
            font-size: 30px;
            background: rgba(255,255,255,0.25);
            border-radius: 999px;
            padding: 12px 20px;
            display: inline-block;
        }

        #resultsScreen {
            background: linear-gradient(180deg, #7FE7FF 0%, #1CA7C9 100%);
            color: white;
        }

        #finalScore {
            background: white;
            color: #073B4C;
            border-radius: 32px;
            padding: 32px;
            display: inline-block;
            min-width: 340px;
        }

        .sea-stars {
            font-size: 44px;
            margin: 14px;
        }

        @media (max-width: 750px) {
            .word-fields {
                grid-template-columns: 1fr;
            }

            button {
                width: 90%;
                max-width: 360px;
            }
        }
    </style>
</head>

<body onload="showDashboard()">

    <div id="dashboardScreen" class="screen">
        <div class="sea-header">🫧 🐠 🪸 🫧</div>
        <h1>🐠 Word Fish</h1>
        <h2>Teacher Dashboard</h2>
        <p class="subtitle">Create vocabulary sets and play ocean-style word games.</p>

        <button class="green-button" onclick="showTeacherScreen()">➕ New Set</button>

        <div id="savedSetsList"></div>
    </div>

    <div id="teacherScreen" class="screen" style="display: none;">
        <div class="sea-header">🐚 📚 🫧</div>
        <h1>📚 Create Vocabulary Set</h1>

        <input id="setName" placeholder="Set name, e.g. Animals">

        <p>Enter English words, one word per line:</p>

        <textarea id="wordList" placeholder="cat&#10;dog&#10;fish"></textarea>

        <br>

        <button class="green-button" onclick="createSetAndOpenCards()">🐟 Create Cards</button>
        <button onclick="showDashboard()">⬅ Back</button>
    </div>

    <div id="cardsScreen" class="screen" style="display: none;">
        <div class="sea-header">🐟 📝 🐟</div>
        <h1>📝 Vocabulary Builder</h1>

        <div class="editor-toolbar">
            <input id="builderSetName" placeholder="Set name">
            <br>

            <button class="green-button" onclick="addNewWord()">➕ New Word</button>
            <button onclick="translateAllToThai()">🌐 Auto Translate Thai</button>
            <button onclick="saveCards()">💾 Save Changes</button>
            <br>
            <button class="yellow-button" onclick="startGame('translation')">▶️ Play with Translation</button>
            <button class="yellow-button" onclick="startGame('picture')">🖼️ Play with Pictures</button>
            <button onclick="showDashboard()">🏠 Back to Dashboard</button>
        </div>

        <div id="cardsList"></div>
    </div>

    <div id="gameScreen" style="display: none;">
        <h1 id="gameTitle">Type the English Word</h1>

        <div id="pearlBar"></div>

        <br>

        <img id="gameImage">

        <div id="currentPrompt"></div>

        <br>

        <input id="answerInput" placeholder="Type English word">

        <br>

        <button class="green-button" onclick="checkAnswer()">✅ Check</button>
        <button class="yellow-button" onclick="showAnswer()">💡 Show Answer</button>

        <p id="feedback"></p>
        <p id="scoreText"></p>
    </div>

    <div id="resultsScreen" class="screen" style="display: none;">
        <div class="sea-header">🦪 ⭐ 🦪</div>
        <h1 id="resultTitle">Great Job!</h1>

        <div id="finalScore"></div>

        <br><br>

        <button class="green-button" onclick="startGame(currentGameMode)">🔁 Play Again</button>
        <button onclick="showDashboard()">🏠 Back to Dashboard</button>
    </div>

    <script>
        let cards = [];
        let currentIndex = 0;
        let score = 0;
        let answerShown = false;
        let hintsUsed = 0;
        let editingSetIndex = null;
        let draggedIndex = null;
        let currentGameMode = "translation";

        const praiseWords = [
            "Great job! 🌟",
            "Excellent! 🐠",
            "Amazing! 🫧",
            "Fantastic! 🐚",
            "Well done! ⭐",
            "Super! 🌊",
            "Brilliant! 🦪"
        ];

        function hideAllScreens() {
            document.getElementById("dashboardScreen").style.display = "none";
            document.getElementById("teacherScreen").style.display = "none";
            document.getElementById("cardsScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultsScreen").style.display = "none";
        }

        function getSavedSets() {
            return JSON.parse(localStorage.getItem("wordFishSets")) || [];
        }

        function saveSets(savedSets) {
            localStorage.setItem("wordFishSets", JSON.stringify(savedSets));
        }

        function showDashboard() {
            hideAllScreens();
            document.getElementById("dashboardScreen").style.display = "block";

            let savedSets = getSavedSets();
            let savedSetsList = document.getElementById("savedSetsList");

            savedSetsList.innerHTML = "";

            if (savedSets.length === 0) {
                savedSetsList.innerHTML = `
                    <div class="card">
                        <h2>🐚 No saved sets yet</h2>
                        <p>Create your first vocabulary set.</p>
                    </div>
                `;
                return;
            }

            for (let i = 0; i < savedSets.length; i++) {
                let wordCount = savedSets[i].cards ? savedSets[i].cards.length : 0;

                savedSetsList.innerHTML += `
                    <div class="card set-card">
                        <h2>📚 ${escapeHTML(savedSets[i].name)}</h2>
                        <p><span class="small-label">Words:</span> ${wordCount}</p>

                        <div class="set-actions">
                            <button class="green-button" onclick="playSavedSet(${i})">▶️ Open</button>
                            <button onclick="editSet(${i})">✏️ Edit</button>
                            <button class="soft-button" onclick="duplicateSet(${i})">📄 Duplicate</button>
                            <button class="red-button" onclick="deleteSet(${i})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }
        }

        function showTeacherScreen() {
            hideAllScreens();
            editingSetIndex = null;

            document.getElementById("teacherScreen").style.display = "block";
            document.getElementById("setName").value = "";
            document.getElementById("wordList").value = "";
        }

        function createSetAndOpenCards() {
            let setName = document.getElementById("setName").value;
            let words = document.getElementById("wordList").value;

            if (setName.trim() === "") {
                alert("Please enter a set name");
                return;
            }

            if (words.trim() === "") {
                alert("Please enter some words");
                return;
            }

            cards = words
                .split("\n")
                .filter(word => word.trim() !== "")
                .map(word => ({
                    english: word.trim(),
                    thai: "",
                    imageUrl: ""
                }));

            let savedSets = getSavedSets();

            savedSets.push({
                name: setName.trim(),
                cards: cards
            });

            saveSets(savedSets);

            editingSetIndex = savedSets.length - 1;

            showCardsScreen();
        }

        function editSet(index) {
            let savedSets = getSavedSets();

            editingSetIndex = index;
            cards = prepareCards(savedSets[index].cards || []);

            showCardsScreen();
        }

        function playSavedSet(index) {
            editSet(index);
        }

        function duplicateSet(index) {
            let savedSets = getSavedSets();
            let selectedSet = savedSets[index];

            savedSets.push({
                name: selectedSet.name + " Copy",
                cards: JSON.parse(JSON.stringify(selectedSet.cards || []))
            });

            saveSets(savedSets);
            showDashboard();
        }

        function deleteSet(index) {
            let savedSets = getSavedSets();

            savedSets.splice(index, 1);
            saveSets(savedSets);

            showDashboard();
        }

        function prepareCards(oldCards) {
            return oldCards.map(card => ({
                english: card.english || "",
                thai: card.thai || "",
                imageUrl: card.imageUrl || ""
            }));
        }

        function showCardsScreen() {
            hideAllScreens();

            document.getElementById("cardsScreen").style.display = "block";

            let savedSets = getSavedSets();

            if (editingSetIndex !== null && savedSets[editingSetIndex]) {
                document.getElementById("builderSetName").value = savedSets[editingSetIndex].name;
            } else {
                document.getElementById("builderSetName").value = "";
            }

            renderCards();
        }

        function renderCards() {
            let cardsList = document.getElementById("cardsList");
            cardsList.innerHTML = "";

            if (cards.length === 0) {
                cardsList.innerHTML = `
                    <div class="card">
                        <h2>🐚 No cards yet</h2>
                        <p>Click + New Word to add your first card.</p>
                    </div>
                `;
                return;
            }

            for (let i = 0; i < cards.length; i++) {
                cardsList.innerHTML += `
                    <div 
                        class="card word-card"
                        ondragover="dragOver(event, ${i})"
                        ondragleave="dragLeave(event)"
                        ondrop="dropCard(${i})"
                    >
                        <div class="word-card-header">
                            <div class="card-number">🐟 Card ${i + 1}</div>

                            <div 
                                class="drag-handle"
                                draggable="true"
                                ondragstart="dragStart(event, ${i})"
                            >
                                ↕ Drag
                            </div>

                            <button class="red-button" onclick="deleteWord(${i})">🗑️ Delete</button>
                        </div>

                        <div class="word-fields">
                            <div class="field-group">
                                <label>🇬🇧 English word</label>
                                <input 
                                    value="${escapeAttribute(cards[i].english)}" 
                                    oninput="cards[${i}].english = this.value"
                                    placeholder="English word"
                                >
                            </div>

                            <div class="field-group">
                                <label>🇹🇭 Thai translation</label>
                                <input 
                                    value="${escapeAttribute(cards[i].thai)}" 
                                    oninput="cards[${i}].thai = this.value"
                                    placeholder="Thai translation"
                                >
                            </div>
                        </div>

                        <div class="image-preview">
                            <strong>🖼️ Image</strong>

                            ${cards[i].imageUrl ? `<img src="${escapeAttribute(cards[i].imageUrl)}">` : `<p>🐚 No image yet</p>`}

                            <input 
                                value="${escapeAttribute(cards[i].imageUrl)}"
                                oninput="cards[${i}].imageUrl = this.value"
                                placeholder="Image URL"
                            >

                            <br>

                            <input 
                                type="file" 
                                accept="image/*"
                                onchange="uploadImage(event, ${i})"
                            >

                            <br>

                            <button class="disabled-button" onclick="aiComingSoon()">🤖✨ AI Generation Coming Soon</button>
                        </div>
                    </div>
                `;
            }
        }

        function aiComingSoon() {
            alert("AI image generation is coming soon! 🤖✨");
        }

        function addNewWord() {
            cards.push({
                english: "",
                thai: "",
                imageUrl: ""
            });

            renderCards();
        }

        function deleteWord(index) {
            cards.splice(index, 1);
            renderCards();
        }

        function dragStart(event, index) {
            draggedIndex = index;
            event.stopPropagation();
        }

        function dragOver(event, index) {
            event.preventDefault();
            event.currentTarget.classList.add("drag-over");
        }

        function dragLeave(event) {
            event.currentTarget.classList.remove("drag-over");
        }

        function dropCard(dropIndex) {
            if (draggedIndex === null) return;

            let draggedCard = cards.splice(draggedIndex, 1)[0];
            cards.splice(dropIndex, 0, draggedCard);

            draggedIndex = null;
            renderCards();
        }

        function uploadImage(event, index) {
            let file = event.target.files[0];

            if (!file) return;

            let reader = new FileReader();

            reader.onload = function(e) {
                cards[index].imageUrl = e.target.result;
                renderCards();
            };

            reader.readAsDataURL(file);
        }

        async function translateAllToThai() {
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].thai.trim() === "" && cards[i].english.trim() !== "") {
                    cards[i].thai = await translateWordToThai(cards[i].english);
                }
            }

            renderCards();
        }

        async function translateWordToThai(word) {
            try {
                let response = await fetch(
                    "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|th"
                );

                let data = await response.json();

                return data.responseData.translatedText || "";

            } catch (error) {
                return "";
            }
        }

        function saveCards() {
            let setName = document.getElementById("builderSetName").value;

            if (setName.trim() === "") {
                alert("Please enter a set name.");
                return;
            }

            cards = cards
                .filter(card => card.english.trim() !== "")
                .map(card => ({
                    english: card.english.trim(),
                    thai: card.thai.trim(),
                    imageUrl: card.imageUrl || ""
                }));

            if (cards.length === 0) {
                alert("Please add at least one word.");
                return;
            }

            let savedSets = getSavedSets();

            if (editingSetIndex === null || !savedSets[editingSetIndex]) {
                savedSets.push({
                    name: setName.trim(),
                    cards: cards
                });

                editingSetIndex = savedSets.length - 1;

            } else {
                savedSets[editingSetIndex] = {
                    name: setName.trim(),
                    cards: cards
                };
            }

            saveSets(savedSets);

            alert("Changes saved! 🐚");

            showCardsScreen();
        }

        function startGame(mode) {
            currentGameMode = mode;

            saveCardsBeforePlay();

            if (cards.length === 0) {
                alert("Please add at least one word.");
                showCardsScreen();
                return;
            }

            if (mode === "translation") {
                let missingTranslations = cards.filter(card => card.thai.trim() === "").length;

                if (missingTranslations > 0) {
                    alert("Some cards have no Thai translation. English words will be shown instead for those cards.");
                }
            }

            if (mode === "picture") {
                let missingImages = cards.filter(card => !card.imageUrl).length;

                if (missingImages > 0) {
                    alert(missingImages + " card(s) have no image. Please add images before playing with pictures.");
                    showCardsScreen();
                    return;
                }
            }

            currentIndex = 0;
            score = 0;
            hintsUsed = 0;

            hideAllScreens();

            document.getElementById("gameScreen").style.display = "block";

            if (mode === "picture") {
                document.getElementById("gameTitle").textContent = "🖼️ Look and Type the English Word";
            } else {
                document.getElementById("gameTitle").textContent = "🇹🇭 Translate and Type the English Word";
            }

            showCard();
        }

        function saveCardsBeforePlay() {
            if (editingSetIndex === null) return;

            let setName = document.getElementById("builderSetName").value || "Untitled Set";

            cards = cards
                .filter(card => card.english.trim() !== "")
                .map(card => ({
                    english: card.english.trim(),
                    thai: card.thai.trim(),
                    imageUrl: card.imageUrl || ""
                }));

            let savedSets = getSavedSets();

            savedSets[editingSetIndex] = {
                name: setName.trim(),
                cards: cards
            };

            saveSets(savedSets);
        }

        function showCard() {
            answerShown = false;

            if (cards.length === 0) {
                showDashboard();
                return;
            }

            let gameImage = document.getElementById("gameImage");
            let currentPrompt = document.getElementById("currentPrompt");

            if (currentGameMode === "picture") {
                gameImage.src = cards[currentIndex].imageUrl;
                gameImage.style.display = "block";

                currentPrompt.textContent = "What is it?";
                currentPrompt.style.fontSize = "38px";

            } else {
                gameImage.style.display = "none";

                let promptText = cards[currentIndex].thai;

                if (promptText.trim() === "") {
                    promptText = cards[currentIndex].english;
                }

                currentPrompt.textContent = promptText;
                currentPrompt.style.fontSize = "52px";
            }

            document.getElementById("answerInput").value = "";
            document.getElementById("feedback").textContent = "";
            document.getElementById("scoreText").textContent = "Score: " + score + " / " + cards.length;

            updatePearls();
        }

        function checkAnswer() {
            let answer = document.getElementById("answerInput").value;
            let correctAnswer = cards[currentIndex].english;

            if (answer.toLowerCase().trim() == correctAnswer.toLowerCase().trim()) {
                if (!answerShown) {
                    score++;
                }

                let randomPraise = praiseWords[Math.floor(Math.random() * praiseWords.length)];
                document.getElementById("feedback").textContent = randomPraise;

                currentIndex++;

                if (currentIndex < cards.length) {
                    setTimeout(showCard, 900);
                } else {
                    setTimeout(showResults, 900);
                }

            } else {
                document.getElementById("feedback").textContent = "Try again! 🐠";
                document.getElementById("answerInput").value = "";
            }
        }

        function showAnswer() {
            if (!answerShown) {
                hintsUsed++;
            }

            answerShown = true;

            let correctAnswer = cards[currentIndex].english;

            document.getElementById("feedback").textContent = "Answer: " + correctAnswer;
        }

        function updatePearls() {
            let pearls = "";

            for (let i = 0; i < cards.length; i++) {
                if (i < score) {
                    pearls += "🦪 ";
                } else {
                    pearls += "○ ";
                }
            }

            document.getElementById("pearlBar").textContent = pearls;
        }

        function showResults() {
            hideAllScreens();

            document.getElementById("resultsScreen").style.display = "block";

            let accuracy = Math.round(score / cards.length * 100);
            let stars = getStars(accuracy);
            let title = getResultTitle(accuracy);

            document.getElementById("resultTitle").textContent = title;

            document.getElementById("finalScore").innerHTML = `
                <div class="sea-stars">${stars}</div>
                <h2>🏆 Score: ${score} / ${cards.length}</h2>
                <h3>💡 Hints used: ${hintsUsed}</h3>
                <h3>📚 Accuracy: ${accuracy}%</h3>
            `;
        }

        function getStars(accuracy) {
            if (accuracy >= 90) return "⭐ ⭐ ⭐ ⭐ ⭐";
            if (accuracy >= 80) return "⭐ ⭐ ⭐ ⭐";
            if (accuracy >= 70) return "⭐ ⭐ ⭐";
            if (accuracy >= 60) return "⭐ ⭐";
            return "⭐";
        }

        function getResultTitle(accuracy) {
            if (accuracy >= 90) return "Excellent! 🌟";
            if (accuracy >= 70) return "Great Job! 🐠";
            if (accuracy >= 50) return "Good Try! 🐚";
            return "Let's Practice Again! 💪";
        }

        function escapeAttribute(text) {
            return String(text)
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        function escapeHTML(text) {
            return String(text)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }
    </script>

</body>
</html>
